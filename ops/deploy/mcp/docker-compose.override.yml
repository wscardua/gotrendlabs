# Explicit opt-in: compose -f ../production/docker-compose.yml -f this-file --profile mcp ...
services:
  mcp:
    build:
      context: ../../..
      dockerfile: ops/deploy/mcp/Dockerfile
    profiles: [mcp]
    restart: unless-stopped
    env_file: [../../../.env.mcp.prod]
    volumes: [mcp_spool:/spool]
    networks: [mcp_private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  fastapi:
    env_file: [../../../.env.prod, ../../../.env.fastapi-db.prod, ../../../.env.auth.prod, ../../../.env.mcp-api.prod]
    networks: [default, mcp_private]
  proxy:
    volumes: [../mcp/Caddyfile.example:/etc/caddy/mcp-routes.caddy:ro]
    networks: [default, mcp_private]
networks:
  mcp_private:
    internal: true
volumes:
  mcp_spool:
